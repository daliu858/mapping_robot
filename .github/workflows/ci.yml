name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JETBOT_TEST_SRC: ${{ runner.temp }}/mapping-workspace/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: bash setup_workspace.sh "$JETBOT_TEST_SRC"
      - run: python -m pytest tests overlay/jetbot_pro/tests -q
